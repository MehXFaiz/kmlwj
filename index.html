<!doctype html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMLWJ | Enterprise Financial Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking: loads as a low-priority "print" stylesheet, then
         swaps to "all" once fetched, instead of stalling first paint on a
         third-party round-trip. font-display:swap (already in the URL) covers
         the brief window before it applies. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    <!-- Apply persisted theme before first paint to avoid a flash of wrong theme -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('kmlwj-theme') || '{}');
        var t = s && s.state && s.state.theme;
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'light' || t === 'dark') {
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(t);
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full font-sans antialiased text-slate-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
