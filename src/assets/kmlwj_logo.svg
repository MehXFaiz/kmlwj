<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f4c81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="192" height="192" rx="33" stroke="rgba(129,140,248,0.2)" stroke-width="1.5" fill="none"/>

  <!-- Top accent line -->
  <rect x="40" y="18" width="120" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.7"/>

  <!-- Central K letter mark -->
  <!-- K vertical stroke -->
  <rect x="68" y="60" width="9" height="80" rx="4" fill="url(#accent)"/>
  <!-- K upper diagonal -->
  <rect x="76" y="60" width="50" height="9" rx="4" fill="url(#accent)" transform="rotate(40 76 64)"/>
  <!-- K lower diagonal -->
  <rect x="76" y="131" width="50" height="9" rx="4" fill="url(#accent)" transform="rotate(-40 76 131)"/>

  <!-- Bottom accent bar -->
  <rect x="40" y="180" width="120" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.7"/>

  <!-- KMLWJ text -->
  <text
    x="100"
    y="156"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="6"
    text-anchor="middle"
    fill="url(#text-grad)"
    filter="url(#glow)"
  >KMLWJ</text>
</svg>
