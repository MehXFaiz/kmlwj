name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # PostgreSQL service the backend connects to during the E2E run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kmlwj_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job proceeds.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Use 127.0.0.1 (not "localhost"): api/_prisma.ts pins DNS to 8.8.8.8/1.1.1.1,
      # which cannot resolve the hostname "localhost". A literal IP skips DNS.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kmlwj_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/kmlwj_test
      JWT_SECRET: ci_test_jwt_access_secret_do_not_use_in_prod
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_do_not_use_in_prod
      NODE_ENV: test
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      APP_URL: http://localhost:5173
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build (type-check + Vite production build)
        run: npm run build

      - name: Apply database schema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Seed database (creates admin@erp.com / guest@erp.com test users)
        run: npx prisma db seed

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
