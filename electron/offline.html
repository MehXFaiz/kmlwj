<head>
<meta charset="utf-8" />
<title>KMLWJ — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #080808;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Plus Jakarta Sans", -apple-system, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; text-align: center; max-width: 440px; padding: 24px;
  }
  .logo-ring {
    width: 88px; height: 88px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, rgba(150,114,89,0.35), rgba(150,114,89,0.05));
    border: 1px solid rgba(150,114,89,0.35);
  }
  .logo-ring img { width: 54px; height: 54px; object-fit: contain; }
  h1 {
    color: #fcfbfa; font-size: 17px; font-weight: 700; letter-spacing: 0.01em;
  }
  p {
    color: #a3a3a3; font-size: 13px; line-height: 1.6;
  }
  button {
    margin-top: 6px;
    padding: 11px 30px; border: none; border-radius: 10px; cursor: pointer;
    color: #fcfbfa; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    background: linear-gradient(90deg, #7D5A44, #A67C5B);
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: default; }
  .hint { color: #6b6b6b; font-size: 11px; }
</style>

    <h1>Can't reach KMLWJ right now</h1>
    <p>
      The app connects to the live KMLWJ server over the internet.
      Please check your connection and try again.
    </p>
    <button id="retry">Retry connection</button>
    <p class="hint">The app will keep working normally once you're back online.</p>
  </div>
  <script>
    // window.desktop is exposed by preload.cjs (contextIsolation on, no Node here).
    const btn = document.getElementById('retry');
    btn.addEventListener('click', () => {
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      window.desktop?.retryConnection();
      // Re-enable after a moment in case this screen stays up (still offline).
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Retry connection'; }, 6000);
    });
    // Auto-retry the moment the OS reports the network is back.
    window.addEventListener('online', () => window.desktop?.retryConnection());
  </script>
