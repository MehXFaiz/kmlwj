# electron-builder configuration — Windows desktop packaging for KMLWJ.
# Run via: npm run dist:win  (see package.json scripts)
#
# This is a THIN CLIENT: the React frontend and the Express/Prisma backend both
# run live on Vercel (https://kmlwj.com). The desktop app is just a native,
# branded window around that live deployment — it ships no backend, no database
# engine, and no secrets. Packaging is therefore only the Electron shell files
# under electron/ plus the handful of runtime npm deps (electron-log,
# electron-updater). No pre-build step is required.

appId: com.kmlwj.desktop
productName: KMLWJ ERP
copyright: Copyright © ${author} — Kutchi Muslim Loharwada Welfare Jamat

directories:
  output: release
  buildResources: build

# Only the Electron shell + package.json are needed. Despite the comment this
# used to have, electron-builder's default node_modules resolution does NOT
# trim to what main.cjs actually requires — package.json's single "dependencies"
# block mixes electron-only packages (electron-log, electron-updater) with the
# entire web app's runtime deps (react, prisma, express, xlsx, jspdf, recharts,
# framer-motion, ...), and without an explicit exclude electron-builder ships
# all of it, bloating the asar with code the thin client never runs.
#
# The explicit list below is the exact runtime require() closure of main.cjs's
# two heavy deps (electron-log, electron-updater), verified by actually
# requiring both in Node and inspecting require.cache, cross-checked against
# every literal require() call in their source for conditionally-loaded
# packages. Do not trim this list without re-verifying the same way — a single
# missing transitive dependency here throws inside boot() with no try/catch
# around it, which breaks app startup entirely, not just auto-update.
files:
  - electron/**/*
  - package.json
  - "!**/*.{md,markdown,map,ts}"
  - "!node_modules/**/*"
  - "node_modules/electron-log/**/*"
  - "node_modules/electron-updater/**/*"
  - "node_modules/graceful-fs/**/*"
  - "node_modules/has-flag/**/*"
  - "node_modules/js-yaml/**/*"
  - "node_modules/jsonfile/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/lodash.escaperegexp/**/*"
  - "node_modules/lodash.isequal/**/*"
  - "node_modules/sax/**/*"
  - "node_modules/supports-color/**/*"
  - "node_modules/universalify/**/*"
  - "node_modules/argparse/**/*"

# asar ON (the default, and correct for a thin client): there is no local Node
# backend or native engine that needs loose files on disk, so the app packs into
# a single compressed archive — smaller, faster to install, and tamper-resistant.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # A single non-square PNG still works — electron-builder auto-generates the
  # multi-resolution .ico from it at build time. For a crisper taskbar/title
  # bar icon, replace build/icon.png with a real square 512x512+ source (or
  # drop in a hand-made build/icon.ico, which takes priority automatically).
  icon: build/icon.png
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KMLWJ ERP
  uninstallDisplayName: KMLWJ Enterprise Financial Suite
  deleteAppDataOnUninstall: false
  # installerIcon / uninstallerIcon / installerHeaderIcon deliberately omitted —
  # NSIS falls back to win.icon above. Setting them explicitly requires a real
  # pre-made .ico (unlike win.icon, they do NOT auto-convert a PNG), so leave
  # them unset unless you've placed a hand-made build/icon.ico in build/.

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

# Auto-update via GitHub Releases (the repo already has a github.com remote).
# electron-updater checks this repo's latest Release for a matching
# `latest.yml` + installer asset. To ship an update: bump "version" in
# package.json, run `npm run dist:win -- --publish always` with a GH_TOKEN
# env var that has `repo` scope (or `gh release create` the artifacts from
# release/ by hand — either way, both the installer AND the auto-generated
# release/latest.yml must be attached to the GitHub Release for existing
# installs to detect it).
#
# This is the complete config electron-updater needs — nothing else to add:
#   - `publish` below is the provider electron-updater reads at runtime
#     (electron/updater.cjs just calls autoUpdater.checkForUpdates(), which
#     resolves this config automatically; the provider isn't duplicated there).
#   - `release/latest.yml` is generated automatically for the nsis target
#     whenever a `publish` block is present — no separate flag needed.
#   - nsis differential (delta) packages are on by default in electron-builder,
#     so returning users download only the changed bytes, not a full reinstall.
publish:
  provider: github
  owner: MehXFaiz
  repo: kmlwj

compression: maximum
